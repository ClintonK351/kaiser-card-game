<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kaiser (3-Spot)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Welcome Screen -->
  <div id="welcome-screen">
    <div id="welcome-content">
      <h1>Welcome to the Nault family 3-spot card game!!!</h1>
      <button id="welcome-btn">Start Game</button>
    </div>
  </div>

  <div id="status-bar">
    Waiting for deal...
  </div>

  <div id="game-container">
    <div id="north" class="player-area"></div>
    <div id="west" class="player-area"></div>
    <div id="east" class="player-area"></div>
    
    <div id="center-area">
      <div id="played-cards"></div>
        </div>

    <div id="dealer-indicator" class="dealer-chip">D</div>

    <div id="bidding-panel" class="hidden">
      <h3>Your Bid</h3>
      <div id="bid-options"></div>
    </div>

    <div id="overlay" class="hidden">
      <div id="overlay-content">
        <h2 id="overlay-title">Hand Over</h2>
        <p id="overlay-msg"></p>
        <button id="overlay-btn">Next Hand</button>
      </div>
    </div>

    <div id="south" class="player-area"></div>
  </div>

  <script src="game.js"></script>
</body>
</html>
