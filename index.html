<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kaiser Card Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-container">
    <!-- Scoreboard -->
    <div id="scoreboard">
      <div id="team-us">Us Score: <span id="score-us">0</span></div>
      <div id="team-them">Them Score: <span id="score-them">0</span></div>
      <div id="trump-indicator">Trump: <span id="trump-suit">None</span></div>
      <hr style="margin: 4px 0; border: 0; border-top: 1px solid rgba(255,255,255,0.3);" />
      <div id="tricks-us">Us Tricks: <span id="tricks-us-count">0</span></div>
      <div id="tricks-them">Them Tricks: <span id="tricks-them-count">0</span></div>
    </div>

    <!-- Player Areas -->
    <div id="north" class="player-area north">
      <div class="player-name">North (Partner)</div>
      <div class="cards-container"></div>
    </div>

    <div id="west" class="player-area west">
      <div class="player-name">West</div>
      <div class="cards-container"></div>
    </div>

    <div id="east" class="player-area east">
      <div class="player-name">East</div>
      <div class="cards-container"></div>
    </div>

    <div id="south" class="player-area south">
      <div class="player-name">South (You)</div>
      <div class="cards-container"></div>
    </div>

    <!-- Center Play Area -->
    <div id="trick-area"></div>

    <!-- Dealer Indicator -->
    <div id="dealer-indicator">DEALER</div>

    <!-- Bidding Dialog Boxes -->
    <div id="bid-dialog-0" class="bid-dialog south-dialog hidden"></div>
    <div id="bid-dialog-1" class="bid-dialog west-dialog hidden"></div>
    <div id="bid-dialog-2" class="bid-dialog north-dialog hidden"></div>
    <div id="bid-dialog-3" class="bid-dialog east-dialog hidden"></div>

    <!-- Human Bidding Controls -->
    <div id="bidding-panel" class="hidden">
      <h3>Your Bid</h3>
      <div class="bidding-controls">
        <label for="bid-amount">Bid:</label>
        <select id="bid-amount">
          <option value="7">7</option>
          <option value="8">8</option>
          <option value="9">9</option>
          <option value="10">10</option>
          <option value="11">11</option>
          <option value="12">12</option>
        </select>

        <label for="bid-suit">Suit:</label>
        <select id="bid-suit">
          <option value="H">Hearts ♥</option>
          <option value="D">Diamonds ♦</option>
          <option value="C">Clubs ♣</option>
          <option value="S">Spades ♠</option>
          <option value="N">No Trump</option>
        </select>

        <button id="btn-submit-bid">Submit Bid</button>
        <button id="btn-pass">Pass</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
